<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Zeeshan's Web Project </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 15px;
            font-family: Arial, sans-serif;
            background-color: #F3F5F8;
            color: #172B4D;
        }

        .container {
            max-width: 820px;
            margin: auto;
            padding: 30px 35px;
            background: #FFFFFF;
            border: 1px solid #E0E5ED;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(23, 43, 77, 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
            color: #172B4D;
            font-size: 40px;
        }

        header p {
            margin: 0;
            color: #64748B;
            font-size: 17px;
        }

        .task {
            margin: 16px 0;
            padding: 14px 16px;
            text-align: center;
            background: #FFFFFF;
            border: 1px solid #E0E5ED;
            border-radius: 9px;
            box-shadow: 0 3px 10px rgba(23, 43, 77, 0.04);
        }

        .task h2 {
            margin: 0 0 12px;
            color: #172B4D;
            font-size: 22px;
        }

        .task a {
            display: block;
            padding: 10px;
            background: #4776E6;
            border: 1px solid #4776E6;
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s ease,
                        transform 0.2s ease;
        }

        .task a:hover {
            background: #315CC5;
            border-color: #315CC5;
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 32px;
            }

            header p {
                font-size: 15px;
            }

            .task {
                padding: 13px 10px;
            }

            .task h2 {
                font-size: 19px;
            }

            .task a {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header>
            <h1> Tasks </h1>
        </header>

        <section class="task">
            <h2> Hotel Reservation Form </h2>
            <a href="task_3.html"> Task 03 </a>
        </section>

        <section class="task">
            <h2> Zeeshan's Article </h2>
            <a href="task_4.html"> Task 04 </a>
        </section>

    </main>
</body>
</html>
